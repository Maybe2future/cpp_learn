<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C++ 全栈教程</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dark-theme.css">
</head>
<body>
  <!-- 顶部导航栏 -->
  <nav class="navbar">
    <div class="nav-left">
      <a href="#" class="logo" onclick="app.showHome(); return false;">
        <span class="logo-icon">C++</span>
        <span>C++ 全栈教程</span>
      </a>
      <div class="nav-links">
        <a href="#" onclick="app.showHome(); return false;" class="active">首页</a>
        <a href="#ch0" onclick="app.showChapter(0); return false;">教程目录</a>
        <a href="#about" onclick="showAbout(); return false;">关于</a>
      </div>
    </div>
    <div class="nav-right">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜索章节...">
      </div>
      <button class="theme-toggle" id="themeToggle" title="切换主题">🌙</button>
      <button class="theme-toggle" id="menuToggle" title="目录" style="display:none;">☰</button>
    </div>
  </nav>

  <!-- 侧边栏 -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">章节目录</div>
    <div id="chapterList"></div>
  </aside>

  <!-- 主内容区 -->
  <main class="main-content">
    <div class="content-container" id="contentArea">
      <div class="loading">加载中...</div>
    </div>
    <div class="footer">
      C++ 全栈教程 · 从入门到现代 C++20 · 持续更新中
    </div>
  </main>

  <!-- 返回顶部 -->
  <button class="back-to-top" id="backToTop">↑</button>

  <!-- 关于弹窗 -->
  <div id="aboutModal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:2000; align-items:center; justify-content:center;">
    <div style="background:var(--bg-primary); padding:32px; border-radius:var(--radius-lg); max-width:480px; border:1px solid var(--border); box-shadow:var(--shadow-md);">
      <h2 style="margin-bottom:16px;">关于 C++ 全栈教程</h2>
      <p style="margin-bottom:12px;">本教程系统覆盖 C++ 编程语言，从基础语法到现代 C++20 特性，共 15 章完整内容。</p>
      <p style="margin-bottom:12px;">包含丰富的代码示例、语法高亮、标准版本标注和实用技巧。</p>
      <p style="margin-bottom:20px; color:var(--text-muted);">版本：v1.0 · 更新日期：2026-05-05</p>
      <button onclick="document.getElementById('aboutModal').style.display='none';" style="padding:8px 20px; border-radius:var(--radius); border:1px solid var(--border); background:var(--accent); color:white; cursor:pointer; font-weight:500;">关闭</button>
    </div>
  </div>

  <script src="js/chapters.js"></script>
  <script src="js/app.js"></script>
  <script>
    function showAbout() {
      document.getElementById('aboutModal').style.display = 'flex';
    }
    // 移动端菜单按钮显示
    if (window.innerWidth <= 768) {
      document.getElementById('menuToggle').style.display = 'flex';
    }
  </script>
</body>
</html>
